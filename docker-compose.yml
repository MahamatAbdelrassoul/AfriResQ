services:
  postgres:
    image: postgres:16
    container_name: afriresq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afriresq
      POSTGRES_PASSWORD: afriresq
      POSTGRES_DB: afriresq
    ports:
      - "5432:5432"
    volumes:
      - afriresq_pg:/var/lib/postgresql/data

volumes:
  afriresq_pg:
